spring:
  application:
    name: chagok-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_AUTH_ISSUER}
          jwk-set-uri: ${SUPABASE_JWKS_URI}

chagok:
  public-data:
    base-url: https://apis.data.go.kr/1160100/service/GetSecuritiesProductInfoService
    service-key: ${PUBLIC_DATA_SERVICE_KEY:}
  google-sheets:
    spreadsheet-id: ${GOOGLE_SHEETS_SPREADSHEET_ID:}
    sheet-name: ${GOOGLE_SHEETS_SHEET_NAME:MarketData}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
